[package]
name = "rpc-spike"
version = "0.0.0"
edition = "2021"

# Phase 0.5 spike ONLY: minimal host proving omp --mode rpc-ui interop.
# Real client lives in crates/cedian_omp (Phase 1). Upstream reference:
# https://github.com/can1357/oh-my-pi/tree/main/sdk/rust/omp-rpc
# (blocking transport + generated wire.rs; vendor or re-derive in Phase 1.)

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
