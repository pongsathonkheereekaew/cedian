[package]
name = "cedian_bench"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

# Frame-cost benchmarks for the cedian panel's thread and history, built on
# GPUI's headless Metal renderer. Kept out of `benchmarks`, whose dev graph
# compiles most of the editor in release.

[lib]
path = "src/cedian_bench.rs"
doctest = false
test = false

[lints]
workspace = true

[dependencies]
cedian_agent = { path = "../cedian_agent" }
cedian_omp = { path = "../cedian_omp" }

[dev-dependencies]
assets.workspace = true
cedian_agent_ui = { path = "../cedian_agent_ui" }
criterion.workspace = true
gpui = { workspace = true, features = ["bench-support"] }
gpui_platform = { workspace = true, features = ["bench-support", "font-kit", "runtime_shaders"] }
settings.workspace = true
theme.workspace = true
theme_settings.workspace = true
ui.workspace = true

[package.metadata.cargo-shear]
ignored = ["gpui_platform"]

[[bench]]
name = "thread_render"
harness = false
