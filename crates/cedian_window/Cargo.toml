[package]
name = "cedian_window"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[[bin]]
name = "cedian"
path = "src/main.rs"

[features]
# Compiles GPUI's Metal shaders when the app starts instead of at build time, for a Mac
# without full Xcode. Builds that ship leave it off.
runtime_shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
anyhow.workspace = true
assets.workspace = true
cedian_agent = { path = "../cedian_agent" }
cedian_index = { path = "../cedian_index" }
cedian_protocol = { path = "../cedian_protocol" }
cedian_wire = { path = "../cedian_wire" }
chrono.workspace = true
collections.workspace = true
editor.workspace = true
futures.workspace = true
gpui.workspace = true
icu_segmenter.workspace = true
gpui_platform.workspace = true
log.workspace = true
release_channel.workspace = true
semver.workspace = true
serde_json.workspace = true
settings.workspace = true
task.workspace = true
terminal.workspace = true
theme.workspace = true
theme_settings.workspace = true
util.workspace = true
zed_actions.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
